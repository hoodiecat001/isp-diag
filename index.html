<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ISP Speed & Diagnostic Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sub {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
        }
        button:active {
            background: #0052a3;
            transform: scale(0.98);
        }
        button:disabled {
            background: #999;
            cursor: not-allowed;
        }
        .results {
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 16px;
            display: none;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
            gap: 8px;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .good { color: #16a34a; font-weight: bold; }
        .bad { color: #dc2626; font-weight: bold; }
        .medium { color: #f59e0b; font-weight: bold; }
        .code-box {
            background: #1e293b;
            color: #00ffcc;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.3rem;
            font-family: monospace;
            letter-spacing: 3px;
            margin-top: 12px;
        }
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #ccc;
            border-top-color: #0066cc;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: #999;
            margin-top: 20px;
        }
        .tip {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .speed-meter {
            background: #e8e8e8;
            border-radius: 10px;
            height: 8px;
            margin: 10px 0;
            overflow: hidden;
        }
        .speed-fill {
            background: #0066cc;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status-excellent { background: #dcfce7; color: #166534; }
        .status-good { background: #dbeafe; color: #1e40af; }
        .status-fair { background: #fed7aa; color: #9a3412; }
        .status-poor { background: #fee2e2; color: #991b1b; }
        .speed-value {
            font-size: 1.4rem;
            font-weight: bold;
        }
        .warn-box {
            background: #fef3c7;
            padding: 12px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 0.85rem;
            border-left: 4px solid #f59e0b;
        }
        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 20px;
            margin: 15px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: #0066cc;
            height: 100%;
            width: 0%;
            transition: width 0.1s;
            border-radius: 10px;
        }
        .live-speed {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 8px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>
            <span>🔍</span>
            ISP Speed & Diagnostic Tool
        </h1>
        <div class="sub">Check your internet speed and connection health</div>

        <button id="runBtn">▶ Start Full Test</button>

        <div id="results" class="results"></div>
    </div>

    <div class="card tip">
        <strong>📱 For accurate results:</strong><br>
        • Connect to your WiFi network<br>
        • Close other apps and tabs<br>
        • Test takes 15-30 seconds<br>
        • Run the test 2-3 times for best results
    </div>

    <div class="footer">
        Results are private — only share the code with our support team
    </div>
</div>

<script>
    const runBtn = document.getElementById('runBtn');
    const resultsDiv = document.getElementById('results');
    
    // Progress elements
    let fillDiv, liveSpeedSpan;
    
    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function checkInternet() {
        try {
            await fetch('https://www.google.com/favicon.ico', { mode: 'no-cors', cache: 'no-store' });
            return { online: true, message: "Connected" };
        } catch(e) {
            return { online: false, message: "No Internet" };
        }
    }

    async function measureLatency() {
        const start = performance.now();
        try {
            await fetch('https://www.google.com/favicon.ico', { mode: 'no-cors', cache: 'no-store' });
            return Math.round(performance.now() - start);
        } catch(e) {
            return null;
        }
    }

    // Speed test using Cloudflare's CORS-friendly endpoint (works everywhere)
    async function runSpeedTest() {
        try {
            // Cloudflare sends exactly 10MB of data with CORS headers enabled
            const url = 'https://speed.cloudflare.com/__down?bytes=10000000&t=' + Date.now();
            const startTime = performance.now();
            
            const response = await fetch(url, { 
                cache: 'no-store',
                headers: { 'Cache-Control': 'no-cache, no-store' }
            });
            
            const totalBytes = 10485760; // 10MB in bytes
            const reader = response.body.getReader();
            let receivedLength = 0;
            let lastUpdate = performance.now();
            
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                receivedLength += value.length;
                
                const now = performance.now();
                if (now - lastUpdate > 100) {
                    const percent = (receivedLength / totalBytes) * 100;
                    const elapsedSec = (now - startTime) / 1000;
                    const currentSpeedMbps = ((receivedLength * 8) / elapsedSec) / 1000000;
                    
                    if (fillDiv) fillDiv.style.width = Math.min(percent, 100) + '%';
                    if (liveSpeedSpan) liveSpeedSpan.innerText = currentSpeedMbps.toFixed(1);
                    lastUpdate = now;
                }
            }
            
            const endTime = performance.now();
            const durationSec = (endTime - startTime) / 1000;
            
            if (durationSec > 0 && receivedLength > 0) {
                const bitsPerSecond = (receivedLength * 8) / durationSec;
                const mbps = bitsPerSecond / 1000000;
                return Math.round(mbps * 10) / 10;
            }
        } catch(e) {
            console.error('Speed test failed:', e);
        }
        return null;
    }

    // Detect actual connection type
    async function getActualConnectionType() {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2000);
            await fetch('http://192.168.1.1/', { 
                mode: 'no-cors',
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            return "WiFi / Ethernet";
        } catch(e) {
            // Cannot reach modem
        }
        
        const connection = navigator.connection || navigator.mozConnection;
        if (connection && connection.type === 'cellular') {
            return "Mobile Data (4G/5G)";
        }
        
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobile) {
            return "Mobile Data (4G/5G)";
        }
        
        return "WiFi / Ethernet";
    }

    function getSpeedRating(speedMbps) {
        if (speedMbps === null) return { text: "Unable to measure", class: "status-poor" };
        if (speedMbps >= 50) return { text: "Excellent", class: "status-excellent" };
        if (speedMbps >= 25) return { text: "Good", class: "status-good" };
        if (speedMbps >= 10) return { text: "Fair", class: "status-fair" };
        return { text: "Poor", class: "status-poor" };
    }

    function getLatencyRating(latencyMs) {
        if (latencyMs === null) return "Unknown";
        if (latencyMs < 50) return "Excellent (<50ms)";
        if (latencyMs < 100) return "Good (50-100ms)";
        if (latencyMs < 200) return "Fair (100-200ms)";
        return "Poor (>200ms)";
    }

    async function runDiagnostic() {
        runBtn.disabled = true;
        runBtn.innerHTML = '<span class="loading"></span> Testing connection (15-30 seconds)...';
        resultsDiv.style.display = 'block';
        resultsDiv.innerHTML = '<div style="text-align:center"><span class="loading"></span> Checking internet...</div>';

        await wait(500);
        const internet = await checkInternet();
        
        if (!internet.online) {
            const connType = await getActualConnectionType();
            const code = Math.random().toString(36).substring(2, 10).toUpperCase();
            
            resultsDiv.innerHTML = `
                <div class="result-item">
                    <span>📡 Internet:</span>
                    <span class="bad">No Internet Connection</span>
                </div>
                <div class="result-item">
                    <span>📶 Connection Type:</span>
                    <span>${connType}</span>
                </div>
                <div class="code-box">
                    🔑 YOUR CODE: ${code}
                </div>
                <div class="warn-box">
                    ⚠️ No internet detected. Please check:<br>
                    • Your modem lights (PON should be solid)<br>
                    • Cables are securely connected<br>
                    • Try restarting your modem
                </div>
                <div style="margin-top: 16px; text-align: center;">
                    <strong>📲 Send this screenshot to our support team</strong>
                </div>
            `;
            
            runBtn.disabled = false;
            runBtn.innerHTML = '▶ Test Again';
            return;
        }
        
        resultsDiv.innerHTML = `
            <div style="text-align:center">
                <span class="loading"></span> Measuring latency...
            </div>
        `;
        await wait(300);
        const latency = await measureLatency();
        
        // Create progress bar UI
        resultsDiv.innerHTML = `
            <div style="text-align:center">
                <span class="loading"></span> Testing download speed...<br>
                <span style="font-size:0.75rem">Downloading 10MB test file</span>
            </div>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill" style="width: 0%"></div>
            </div>
            <div class="live-speed">
                Current speed: <span id="liveSpeed">0</span> Mbps
            </div>
        `;
        
        fillDiv = document.getElementById('progressFill');
        liveSpeedSpan = document.getElementById('liveSpeed');
        
        await wait(500);
        
        const speedMbps = await runSpeedTest();
        const speedSource = "Cloudflare";
        
        const connType = await getActualConnectionType();
        const code = Math.random().toString(36).substring(2, 10).toUpperCase();
        
        const speedRating = getSpeedRating(speedMbps);
        const latencyRating = getLatencyRating(latency);
        
        let recommendation = "";
        let recommendationClass = "";
        
        if (speedMbps !== null && speedMbps < 10) {
            recommendation = "⚠️ Your speed is very slow. Please check your modem's optical power or consider upgrading your plan.";
            recommendationClass = "bad";
        } else if (latency !== null && latency > 150) {
            recommendation = "⚠️ Your latency is high, causing lag. This often indicates a signal or routing issue.";
            recommendationClass = "bad";
        } else if (speedMbps !== null && speedMbps < 25) {
            recommendation = "📱 Your speed is adequate for browsing but may struggle with HD streaming or multiple devices.";
            recommendationClass = "medium";
        } else if (speedMbps !== null && speedMbps >= 25) {
            recommendation = "✅ Your connection looks healthy! If you're still having issues, it might be a specific website, app, or device problem.";
            recommendationClass = "good";
        } else {
            recommendation = "💡 Speed test couldn't complete. Please run fast.com manually and send us a screenshot of the result.";
            recommendationClass = "medium";
        }
        
        const speedPercent = Math.min(((speedMbps || 0) / 100) * 100, 100);
        
        resultsDiv.innerHTML = `
            <div class="result-item">
                <span>📡 Internet:</span>
                <span class="good">Connected</span>
            </div>
            <div class="result-item">
                <span>⚡ Latency (Ping):</span>
                <span>${latency ? latency + ' ms' : 'Unable to measure'} <span class="status-badge ${latency && latency < 100 ? 'status-excellent' : (latency && latency < 200 ? 'status-fair' : 'status-poor')}">${latencyRating}</span></span>
            </div>
            <div class="result-item">
                <span>🚀 Download Speed:</span>
                <span><span class="speed-value">${speedMbps ? speedMbps + ' Mbps' : 'Unable to measure'}</span> <span class="status-badge ${speedRating.class}">${speedRating.text}</span><br><span style="font-size:0.7rem; color:#666;">via ${speedSource}</span></span>
            </div>
            <div class="result-item">
                <span>📶 Connection Type:</span>
                <span><strong>${connType}</strong></span>
            </div>
            <div class="speed-meter">
                <div class="speed-fill" style="width: ${speedPercent}%"></div>
            </div>
            <div class="result-item" style="background: #f0f9ff; margin-top: 8px; border-radius: 8px;">
                <span>💡 Recommendation:</span>
                <span class="${recommendationClass}">${recommendation}</span>
            </div>
            <div class="code-box">
                🔑 YOUR CODE: ${code}
            </div>
            <div style="margin-top: 16px; text-align: center; background: #e6f7e6; padding: 12px; border-radius: 12px;">
                <strong>📲 Send this screenshot to our support team on Messenger</strong><br>
                <span style="font-size:0.75rem">Include the code: ${code}</span>
            </div>
        `;

        runBtn.disabled = false;
        runBtn.innerHTML = '▶ Test Again';
    }

    runBtn.addEventListener('click', runDiagnostic);
</script>
</body>
</html>
